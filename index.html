<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kişisel Panel</title>
<meta name="robots" content="noindex, nofollow">
<script>try{var t=localStorage.getItem("panel.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Düzen: solda cam sekme rafı, üstte saatli karşılama alanı, altında 12 sütunlu kart ızgarası. Derin lacivert + şampanya altını. */
:root{
  --bg:#F1F2F6; --glow1:rgba(176,132,52,.16); --glow2:rgba(70,100,240,.10); --grid:rgba(20,30,60,.045);
  --surface:rgba(255,255,255,.78); --surface-solid:#FFFFFF; --surface-2:#F2F3F7; --line:rgba(17,24,39,.09); --line-strong:rgba(17,24,39,.18);
  --ink:#111622; --muted:#5D6576; --accent:#94702C; --accent-soft:#F3EBDA; --accent-2:#3E5BD6; --accent2-soft:#E5EAFC;
  --mark:#1B8589; --mark-soft:#DCF0F0;
  --good:#1D8752; --good-soft:#DDF2E6; --warn:#AE6A08; --warn-soft:#FBEDD3; --crit:#C7372F; --crit-soft:#FBE2E0;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 14px 34px -18px rgba(16,24,40,.22);
  --hero-ring:linear-gradient(125deg,rgba(148,112,44,.55),rgba(148,112,44,0) 38%,rgba(62,91,214,0) 62%,rgba(62,91,214,.45));
  --blockL:88%; --blockInk:22%;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Inter", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#080B11; --glow1:rgba(216,180,116,.15); --glow2:rgba(100,130,255,.13); --grid:rgba(255,255,255,.035);
  --surface:rgba(19,24,34,.66); --surface-solid:#11161F; --surface-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.17);
  --ink:#ECEEF3; --muted:#8C94A6; --accent:#D8B474; --accent-soft:rgba(216,180,116,.14); --accent-2:#8FA5FF; --accent2-soft:rgba(143,165,255,.14);
  --mark:#5FCACA; --mark-soft:rgba(95,202,202,.13);
  --good:#5BD08F; --good-soft:rgba(91,208,143,.13); --warn:#F0B65E; --warn-soft:rgba(240,182,94,.14); --crit:#FF7D72; --crit-soft:rgba(255,125,114,.14);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 20px 44px -24px rgba(0,0,0,.8);
  --hero-ring:linear-gradient(125deg,rgba(216,180,116,.7),rgba(216,180,116,0) 38%,rgba(143,165,255,0) 62%,rgba(143,165,255,.55));
  --blockL:24%; --blockInk:90%; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#080B11; --glow1:rgba(216,180,116,.15); --glow2:rgba(100,130,255,.13); --grid:rgba(255,255,255,.035);
  --surface:rgba(19,24,34,.66); --surface-solid:#11161F; --surface-2:rgba(255,255,255,.045); --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.17);
  --ink:#ECEEF3; --muted:#8C94A6; --accent:#D8B474; --accent-soft:rgba(216,180,116,.14); --accent-2:#8FA5FF; --accent2-soft:rgba(143,165,255,.14);
  --mark:#5FCACA; --mark-soft:rgba(95,202,202,.13);
  --good:#5BD08F; --good-soft:rgba(91,208,143,.13); --warn:#F0B65E; --warn-soft:rgba(240,182,94,.14); --crit:#FF7D72; --crit-soft:rgba(255,125,114,.14);
  --shadow:inset 0 1px 0 rgba(255,255,255,.04), 0 20px 44px -24px rgba(0,0,0,.8);
  --hero-ring:linear-gradient(125deg,rgba(216,180,116,.7),rgba(216,180,116,0) 38%,rgba(143,165,255,0) 62%,rgba(143,165,255,.55));
  --blockL:24%; --blockInk:90%; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
a{color:inherit}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
/* Kenar çubuğu */
.side{position:sticky;top:0;align-self:start;height:100vh;padding:24px 14px 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:22px;border-right:1px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;padding-left:10px}
.brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.tabs{display:flex;flex-direction:column;gap:2px}
.tab{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:var(--muted);font-weight:500}
.tab svg{width:18px;height:18px;flex:none}
.tab:hover{background:var(--surface-2);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.tab[aria-selected="true"] svg{color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tab .cnt{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--crit)}
.sync{margin-top:auto;font-size:12px;color:var(--muted);padding-left:10px;display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--good)} .sync.err .dot{background:var(--crit)}
/* Ana alan */
main{padding-block:26px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));min-width:0}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 28px;margin-bottom:22px}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.015em;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin-top:6px}
.term{min-width:240px;flex:0 1 320px}
.term-row{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:6px}
.term-row b{color:var(--ink);font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:6px}
.bar.mark>i{background:var(--mark)} .bar.good>i{background:var(--good)} .bar.crit>i{background:var(--crit)}
.demo-bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;background:var(--mark-soft);border:1px solid color-mix(in srgb,var(--mark) 35%,transparent);border-radius:var(--r);padding:10px 14px;margin-bottom:18px;font-size:13px}
.btn{all:unset;cursor:pointer;font-weight:600;font-size:13px;padding:6px 12px;border-radius:8px;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink)}
.btn:hover{box-shadow:0 0 0 1px var(--accent)} .btn:focus-visible{outline:2px solid var(--accent)}
.view[hidden]{display:none!important}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:16px;margin:0 0 12px;display:flex;align-items:baseline;gap:8px}
.card h2 .meta{margin-left:auto;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.empty q{display:block;margin-top:6px;font-family:var(--f-mono);font-size:12px;color:var(--ink);background:var(--surface-2);border-radius:8px;padding:8px 10px;quotes:"“" "”"}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);min-width:0}
.row:first-child{border-top:0;padding-top:2px}
.row .main{min-width:0;flex:1}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.chip{flex:none;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.crit{background:var(--crit-soft);color:var(--crit)} .chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.acc{background:var(--accent-soft);color:var(--accent)} .chip.mark{background:var(--mark-soft);color:var(--mark)}
.sw{width:4px;align-self:stretch;border-radius:4px;flex:none;background:hsl(var(--h,220) 60% 55%)}
.big{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:16px}
.lnk{color:var(--accent);text-decoration:none;font-weight:500;font-size:12.5px}
.lnk:hover{text-decoration:underline}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:500;font-size:13px;padding:7px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.links a:hover{border-color:var(--accent)}
.fav{width:16px;height:16px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 45%)}
/* Bugünkü dersler zaman çizgisi */
.tl .row .time{width:92px;flex:none;font-size:12.5px}
.row.now{background:var(--accent-soft);border-radius:9px;padding-inline:10px;margin-inline:-10px;border-top-color:transparent}
.row.past{opacity:.5}
/* Spotify kutucukları */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.tile{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:12px;text-decoration:none;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);min-width:0;transition:border-color .15s}
.tile:hover{border-color:var(--accent)}
.cover{width:52px;height:52px;border-radius:7px;object-fit:cover;flex:none;display:block;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.cover.ph{background:linear-gradient(145deg,hsl(var(--h) 55% 45%),hsl(calc(var(--h) + 40) 50% 25%))}
.tile .tx{display:flex;flex-direction:column;min-width:0;flex:1}
.tile .tx b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .tx span{font-size:12px;color:var(--muted)}
.tile .play{width:30px;height:30px;border-radius:50%;background:var(--good);display:grid;place-items:center;flex:none;opacity:.85;transition:transform .15s,opacity .15s}
.tile .play svg{width:11px;height:11px;fill:#fff;margin-left:2px}
.tile:hover .play{opacity:1;transform:scale(1.08)}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Haftalık program */
.week-wrap{overflow-x:auto}
.week{display:grid;min-width:680px;padding-bottom:10px;grid-template-columns:52px repeat(var(--days),minmax(110px,1fr));gap:0 8px}
.wh{font-size:12px;font-weight:600;color:var(--muted);padding:0 0 8px;text-align:center}
.wh.today{color:var(--mark)}
.wcol{position:relative;border-radius:8px;background:var(--surface-2)}
.wcol.today{background:var(--mark-soft)}
.wtimes{position:relative}
.wtimes span{position:absolute;right:6px;font-size:11px;color:var(--muted);transform:translateY(-50%)}
.wline{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.blk{position:absolute;left:4px;right:4px;border-radius:7px;padding:5px 7px;overflow:hidden;font-size:12px;line-height:1.3;
  background:hsl(var(--h) 55% var(--blockL));color:hsl(var(--h) 45% var(--blockInk));border-left:3px solid hsl(var(--h) 55% 50%)}
.blk b{display:block;font-weight:600}
.blk.short{padding-block:3px;font-size:11.5px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--crit);z-index:2}
.nowline::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
/* Kanban */
.kan-wrap{overflow-x:auto}
.kan{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px;min-width:880px}
.kcol{background:var(--surface-2);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.kcol h3{margin:0 0 4px;font-size:12.5px;font-weight:600;display:flex;justify-content:space-between;color:var(--muted)}
.kcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.kcard .t{font-weight:600}
.kcard .d{font-size:12px;color:var(--muted)}
/* Proje kartları */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{display:flex;flex-direction:column;gap:10px}
.pcard .head{display:flex;align-items:center;gap:10px}
.pcard .av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;background:hsl(var(--h) 50% 42%);flex:none}
.pcard p{margin:0;color:var(--muted);font-size:13px}
.next{font-size:13px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.next .label{display:block;margin-bottom:2px}
/* Kitap rafı */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.book{display:flex;gap:10px;padding:10px;border-radius:10px;background:var(--surface-2);min-width:0}
.spine{width:36px;height:52px;border-radius:3px 6px 6px 3px;flex:none;background:linear-gradient(90deg,hsl(var(--h) 45% 32%) 0 5px,hsl(var(--h) 50% 46%) 5px);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:700;font-size:13px}
.stars{color:var(--mark);letter-spacing:1px;font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.seg button{all:unset;cursor:pointer;font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;color:var(--muted);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent)}
/* Finans */
.money{font-variant-numeric:tabular-nums}
.pos{color:var(--good)} .neg{color:var(--crit)}
.catrow{display:grid;grid-template-columns:120px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:13px;padding:5px 0}
.catrow .bar{height:8px}
.cal{display:flex;flex-direction:column;gap:0;position:relative;padding-left:16px}
.cal::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:2px;background:var(--line)}
.cal .row{position:relative}
.cal .row::before{content:"";position:absolute;left:-16px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--surface-solid);border:2px solid var(--line)}
.cal .row.next::before{border-color:var(--mark);background:var(--mark)}
.cal .row.done{opacity:.5}
.ring{--p:0;width:110px;height:110px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:radial-gradient(closest-side,var(--surface-solid) 76%,transparent 77%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--surface-2) 0)}
.ring b{font-family:var(--f-display);font-size:22px}
.flex{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.chip.sp{min-width:74px;text-align:center}
.chip.sp.sm{min-width:0;width:24px;padding:3px 0}
.fb-fut,.fb-bas,.fb-vol{background:#0E1E5B;color:#FFED00}
.fb-bas{background:#FFED00;color:#0E1E5B}
.fb-vol{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px #0E1E5B}
.fbcard{background:linear-gradient(120deg,color-mix(in srgb,#0E1E5B 10%,var(--surface)),var(--surface) 60%)}
.lgw,.nolg{position:relative;overflow:hidden}
.lgw img{width:100%;height:100%;object-fit:contain;display:block}
.fav.lgw{background:#fff;box-shadow:0 0 0 1px var(--line)}
.fav.lgw img{padding:1px}
.nolg::after{content:attr(data-l);position:absolute;inset:0;display:grid;place-items:center;font-size:9px;font-weight:700;color:#fff;background:hsl(var(--h) 55% 45%)}
.fav.lg24{width:26px;height:26px;border-radius:7px;flex:none}
.fav.lg24.nolg::after{font-size:12px}
.tlogo{width:26px;height:26px;flex:none;border-radius:6px}
.tlogo.nolg{border-radius:50%}
.tlogo.nolg::after{font-size:11px}
.tlogo.xl{width:38px;height:38px}
.nextm{display:flex;align-items:center;gap:10px;margin-top:4px}
.fblogo{width:22px;height:22px;object-fit:contain}
.brand-row{display:flex;align-items:center;gap:9px}
.school{width:26px;height:26px;border-radius:6px;background:#fff;padding:2px;box-shadow:0 0 0 1px var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .pill{width:14px;height:14px;padding:0}
.legend b{color:var(--ink);font-weight:500}
.curr{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.sem{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.semh{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:8px;color:var(--muted)}
.semh b{color:var(--ink);font-weight:600}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-block;font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:7px;border:1px solid transparent;white-space:nowrap}
.p-pass{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.p-take{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.p-rem{background:var(--surface);color:var(--ink);border-color:var(--line)}
.p-fail{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.pill .gr{margin-left:6px;font-weight:700;opacity:.85}
.p-elec{background:transparent;color:var(--mark);border:1px dashed var(--mark)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:0 10px 8px 0}
td{padding:9px 10px 9px 0;border-top:1px solid var(--line);vertical-align:middle}
.tbl{overflow-x:auto}
.lock{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--bg);padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.lock-card{width:100%;max-width:340px;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 24px}
.lock-card h1{font-size:22px}
.lock-card p{margin:0;color:var(--muted)}
.lock-ic{width:30px;height:30px;color:var(--accent)}
#lockPw{font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
#lockPw:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.lock-rem{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.lock-btn{text-align:center;padding:10px;background:var(--ink);color:var(--bg);box-shadow:none}
.lock-err{min-height:18px;font-size:13px;color:var(--crit)}
.lockout{all:unset;cursor:pointer;margin-left:auto;font-size:12px;color:var(--muted);text-decoration:underline}
.lockout:focus-visible{outline:2px solid var(--accent)}
/* ---------- Premium katman ---------- */
body{min-height:100vh;-webkit-font-smoothing:antialiased}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(900px 520px at 6% -12%,var(--glow1),transparent 62%),radial-gradient(820px 520px at 104% -4%,var(--glow2),transparent 60%)}
.bgfx::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:46px 46px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
.side{background:color-mix(in srgb,var(--surface-solid) 45%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-right:1px solid var(--line);width:236px}
.app{grid-template-columns:236px minmax(0,1fr)}
.brand{font-size:19px}
.school{background:#fff}
.tab{position:relative;padding:9px 12px;border-radius:10px;transition:background .15s,color .15s}
.tab[aria-selected="true"]{background:var(--accent-soft);box-shadow:none;color:var(--ink)}
.tab[aria-selected="true"]::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.tab kbd{margin-left:auto;font:500 10.5px var(--f-mono);color:var(--muted);opacity:0;transition:opacity .15s}
.tab .cnt+kbd{margin-left:8px}
.side:hover .tab kbd{opacity:.7}
.tab .cnt{min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--crit-soft);color:var(--crit);display:inline-grid;place-items:center}
.tab .cnt:empty{display:none}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.search-btn{all:unset;cursor:pointer;display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:13px}
.search-btn svg{width:16px;height:16px}
.search-btn kbd,.cmdk kbd{margin-left:auto;font:500 10.5px var(--f-mono);padding:2px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.search-btn:hover{border-color:var(--line-strong);color:var(--ink)}
.search-btn:focus-visible,.theme button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.theme{display:grid;grid-template-columns:repeat(3,1fr);padding:3px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.theme button{all:unset;cursor:pointer;display:grid;place-items:center;height:28px;border-radius:8px;color:var(--muted)}
.theme button svg{width:16px;height:16px}
.theme button[aria-checked="true"]{background:var(--surface-solid);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sync{padding-left:4px}
/* Karşılama alanı */
.hero{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:20px 32px;margin-bottom:20px;padding:26px 28px;border-radius:22px;
  background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,var(--hero-ring) border-box;border:1px solid transparent;box-shadow:var(--shadow);overflow:hidden}
.hero::before{content:"";position:absolute;inset:-40% 40% auto -10%;height:220%;background:radial-gradient(closest-side,var(--glow1),transparent);pointer-events:none}
.hero>*{position:relative}
.hero-main{min-width:0;flex:1 1 420px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:8px}
.hero h1{font-size:clamp(28px,3.2vw,40px);letter-spacing:-.025em;line-height:1.05}
.hl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.hl a{display:inline-flex;align-items:center;gap:8px;max-width:100%;padding:7px 12px 7px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);text-decoration:none;font-size:13px;transition:border-color .15s,transform .15s}
.hl a:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.hl a:focus-visible{outline:2px solid var(--accent)}
.hl i{width:8px;height:8px;border-radius:50%;flex:none;background:var(--accent)}
.hl i.crit{background:var(--crit)} .hl i.good{background:var(--good)} .hl i.blue{background:var(--accent-2)} .hl i.mark{background:var(--mark)}
.hl span{color:var(--muted)} .hl b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:14px;min-width:230px}
.clock{font-family:var(--f-display);font-weight:500;font-size:clamp(36px,4vw,52px);letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.clock small{font-size:.42em;color:var(--muted);margin-left:4px;letter-spacing:0}
.hero .term{width:100%;min-width:230px;flex:none}
/* Kartlar */
.card{background:var(--surface);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px;transition:border-color .2s}
.card:hover{border-color:var(--line-strong)}
.card h2{font-size:15.5px;letter-spacing:-.01em;margin-bottom:14px}
.card h2::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--accent);align-self:center;flex:none;transform:rotate(45deg)}
.grid{gap:18px}
.bar{height:6px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.bar>i{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,transparent),var(--accent))}
.chip{border:1px solid transparent}
.chip.acc{background:var(--accent2-soft);color:var(--accent-2)}
.lnk{color:var(--accent-2)}
.big{letter-spacing:-.02em}
.row.now{background:var(--accent-soft)}
.links a,.tile{background:var(--surface-2)}
.links a:hover,.tile:hover{border-color:var(--accent)}
.lock{background:color-mix(in srgb,var(--bg) 55%,transparent);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.lock-card{background:linear-gradient(var(--surface-solid),var(--surface-solid)) padding-box,var(--hero-ring) border-box;border:1px solid transparent;box-shadow:var(--shadow);border-radius:20px}
/* ---------- Etiketler, karolar, listeler ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 8px 0 7px;border-radius:6px;font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap;vertical-align:middle}
.chip::before{content:"";width:6px;height:6px;border-radius:2px;background:currentColor;flex:none}
.chip.crit,.chip.warn,.chip.good,.chip.acc,.chip.mark{background:color-mix(in srgb,currentColor 9%,transparent);border-color:color-mix(in srgb,currentColor 28%,transparent)}
.chip.crit{color:var(--crit)} .chip.warn{color:var(--warn)} .chip.good{color:var(--good)} .chip.acc{color:var(--accent-2)} .chip.mark{color:var(--mark)}
.row .d .chip{height:18px;font-size:9.5px;padding:0 6px 0 5px;margin-right:8px;gap:5px}
.row .d .chip::before{width:5px;height:5px}
/* geri sayım karosu */
.cd{flex:none;display:inline-grid;place-items:center;align-content:center;min-width:48px;height:42px;padding:0 6px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);line-height:1;gap:3px}
.cd b{font-family:var(--f-display);font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.cd small{font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.cd.word b{font-size:12px;letter-spacing:.02em}
.cd.crit{border-color:color-mix(in srgb,var(--crit) 40%,transparent);background:color-mix(in srgb,var(--crit) 10%,transparent);color:var(--crit)}
.cd.warn{border-color:color-mix(in srgb,var(--warn) 38%,transparent);background:color-mix(in srgb,var(--warn) 9%,transparent);color:var(--warn)}
.cd.far b{color:var(--ink)}
.cd.past{opacity:.6} .cd.past small{font-size:8px}
/* takvim yaprağı */
.dt{flex:none;width:46px;display:inline-flex;flex-direction:column;align-items:center;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-solid);line-height:1}
.dt small:first-child{width:100%;text-align:center;padding:3px 0 2px;font-size:8.5px;font-weight:700;letter-spacing:.12em;color:var(--accent);background:var(--accent-soft)}
.dt b{font-family:var(--f-display);font-size:18px;font-weight:700;padding:4px 0 1px;font-variant-numeric:tabular-nums}
.dt small:last-child{font-size:9px;color:var(--muted);padding-bottom:4px;font-family:var(--f-mono)}
.dt.on{border-color:var(--accent)} .dt.on small:first-child{background:var(--accent);color:var(--bg)}
.row.done{opacity:.5}
.list .row{gap:14px;padding:11px 0}
.list .row .t{font-size:14px}
.list .row .d{margin-top:2px;display:flex;align-items:center;flex-wrap:wrap}
/* ders kodu rozeti */
.code{flex:none;font-family:var(--f-mono);font-size:11.5px;font-weight:600;padding:5px 8px;border-radius:7px;color:hsl(var(--h) 65% 33%);background:hsl(var(--h) 60% 50% / .1);border:1px solid hsl(var(--h) 60% 50% / .28)}
:root[data-theme="dark"] .code{color:hsl(var(--h) 70% 72%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .code{color:hsl(var(--h) 70% 72%)}}
/* spor rozeti ve sonuç */
.spb{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.spb svg{width:17px;height:17px}
.spb.fb-fut{background:#0E1E5B;color:#FFED00}
.spb.fb-bas{background:#FFED00;color:#0E1E5B}
.spb.fb-vol{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.res{flex:none;display:inline-flex;align-items:stretch;height:28px;border-radius:8px;overflow:hidden;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.res i{font-style:normal;display:grid;place-items:center;width:24px;font-size:11px;font-weight:700;color:#fff}
.res b{display:flex;align-items:center;gap:3px;padding:0 9px;font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2)}
.res b em{font-style:normal;color:var(--muted)}
.res.win i{background:var(--good)} .res.loss i{background:var(--crit)} .res.draw i{background:var(--warn)}
/* segment seçici */
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);margin-bottom:14px}
.seg button{border-radius:7px;padding:5px 11px;background:transparent}
.seg button[aria-pressed="true"]{background:var(--surface-solid);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2)}
/* tablolar */
.tbl{border:1px solid var(--line);border-radius:12px;overflow:auto}
table{font-size:13px}
th{padding:10px 14px;background:var(--surface-2);font-size:10.5px;letter-spacing:.1em}
td{padding:11px 14px}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 70%,transparent)}
/* öne çıkanlar şeridi daha köşeli */
.hl a{border-radius:10px}
.links a{border-radius:10px}
/* ---------- Ders programı ---------- */
.week{grid-template-columns:54px repeat(var(--days),minmax(120px,1fr));gap:0 10px;padding-bottom:6px}
.wh{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0 10px;margin-bottom:8px;border-radius:12px;color:var(--muted)}
.wh span{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.wh b{font-family:var(--f-display);font-size:22px;font-weight:700;color:var(--ink);line-height:1.1}
.wh small{font-size:10.5px}
.wh.today{background:var(--accent-soft);color:var(--accent)}
.wh.today b{color:var(--accent)}
.wcol{border-radius:12px;background:var(--surface-2);border:1px solid var(--line)}
.wcol.today{background:color-mix(in srgb,var(--accent) 6%,transparent);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.wline{border-top:1px solid var(--line)}
.wline.half{border-top:1px dashed color-mix(in srgb,var(--line) 60%,transparent)}
.wtimes span{font-size:10.5px;right:10px}
.blk{left:5px;right:5px;border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;border:1px solid hsl(var(--h) 60% 50% / .32);border-left:0;
  background:linear-gradient(160deg,hsl(var(--h) 70% 55% / .2),hsl(var(--h) 70% 55% / .07));color:var(--ink);overflow:hidden;
  box-shadow:inset 3px 0 0 hsl(var(--h) 65% 52%);transition:transform .15s,box-shadow .15s}
.blk:hover{transform:translateY(-1px);box-shadow:inset 3px 0 0 hsl(var(--h) 65% 52%),0 10px 24px -14px hsl(var(--h) 60% 40% / .7);z-index:3}
.blk .bh{display:flex;align-items:center;gap:6px}
.blk .bh b{font-family:var(--f-mono);font-size:12.5px;font-weight:700;color:hsl(var(--h) 65% 30%)}
.blk .bh em{font-style:normal;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:2px 5px;border-radius:4px;background:hsl(var(--h) 65% 45% / .2);color:hsl(var(--h) 65% 30%)}
.blk .bn{font-size:11.5px;line-height:1.3;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.blk .bf{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:11px;color:var(--muted)}
.blk .br{display:inline-flex;align-items:center;gap:3px}
.blk .br svg{width:11px;height:11px}
.blk.short{padding:5px 9px;gap:1px}
.blk.short .bf{margin-top:0}
.blk.over{opacity:.45}
.blk.live{box-shadow:inset 3px 0 0 hsl(var(--h) 65% 52%),0 0 0 2px var(--accent),0 10px 28px -12px hsl(var(--h) 60% 40% / .8)}
.livedot{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 var(--accent);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 60%,transparent)}100%{box-shadow:0 0 0 8px transparent}}
:root[data-theme="dark"] .blk .bh b,:root[data-theme="dark"] .blk .bh em{color:hsl(var(--h) 80% 76%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .blk .bh b,:root:not([data-theme="light"]) .blk .bh em{color:hsl(var(--h) 80% 76%)}}
.nowline{height:2px;background:var(--accent);z-index:4;box-shadow:0 0 12px var(--accent)}
.nowline::before{background:var(--accent);left:-5px;top:-4px;width:10px;height:10px}
.nowline span{position:absolute;right:4px;top:-9px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--accent);color:var(--bg)}
.wlegend{display:flex;flex-wrap:wrap;gap:8px 10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.wlegend span{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line)}
.wlegend i{width:9px;height:9px;border-radius:3px;background:hsl(var(--h) 65% 52%)}
.wlegend b{font-family:var(--f-mono);font-size:11.5px;color:var(--ink)}
.wlegend em{font-style:normal;font-size:11px;color:var(--muted)}
.wlegend .wtotal{margin-left:auto;background:transparent;border:0}
.wlegend .wtotal b{font-family:var(--f-body);font-size:12.5px}
/* Bugünkü dersler */
.tl .row{gap:12px}
.tl .row .time{width:46px;display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--muted);line-height:1.35}
.tl .row .time b{font-size:13px;color:var(--ink);font-weight:600}
.tbar{width:4px;align-self:stretch;border-radius:4px;flex:none;background:hsl(var(--h) 65% 52%)}
.tl .row.now{background:var(--accent-soft);border-radius:12px;padding:11px 12px;margin-inline:-12px}
/* ---------- Hava ve sosyal ---------- */
.stack{display:flex;flex-direction:column;gap:18px;min-width:0}
.wxi{width:22px;height:22px;flex:none;color:var(--muted)}
.wxi .wsun{color:var(--accent);stroke:var(--accent)}
.wxi .wmoon{stroke:var(--accent-2)}
.wxi .wrain{stroke:var(--accent-2)}
.wxi .wsnow{fill:var(--accent-2);stroke:none}
.wxi.big{width:52px;height:52px;stroke-width:1.3}
.clockrow{display:flex;align-items:center;gap:16px}
.wx-mini{display:inline-flex;align-items:center;gap:8px;padding-right:16px;border-right:1px solid var(--line)}
.wx-mini .wxi{width:30px;height:30px;stroke-width:1.5}
.wx-mini span{display:flex;flex-direction:column;line-height:1.15}
.wx-mini b{font-family:var(--f-display);font-size:20px;font-weight:600}
.wx-mini small{font-size:11.5px;color:var(--muted)}
.socials{display:flex;gap:6px;justify-content:space-between}
.soc{flex:1;display:grid;place-items:center;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);transition:border-color .15s,transform .15s}
.soc:hover{border-color:var(--accent);transform:translateY(-1px)}
.soc:focus-visible{outline:2px solid var(--accent)}
.socl{width:18px;height:18px;border-radius:5px}
.socl.nolg::after{font-size:9px}
.socl.lgw{background:transparent}
/* ---------- piyasam ---------- */
.pmcard h2::before{display:none}
.pm-wm{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.02em}
.pm-wm b{background:linear-gradient(120deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.pm-mk{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.pm-t{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 12px 34px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-decoration:none;overflow:hidden;min-width:0;transition:border-color .15s}
.pm-t:hover{border-color:var(--line-strong)}
.pm-n{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-t b{font-size:16px;font-weight:600;white-space:nowrap}
.pm-c{font:600 11.5px var(--f-mono)}
.pos{color:var(--good)} .neg{color:var(--crit)}
.spk{position:absolute;left:0;right:0;bottom:0;width:100%;height:30px}
.spk .l{fill:none;stroke-width:1.6;vector-effect:non-scaling-stroke}
.spk.up .l{stroke:var(--good)} .spk.down .l{stroke:var(--crit)}
.spk .a{opacity:.12} .spk.up .a{fill:var(--good)} .spk.down .a{fill:var(--crit)}
.pm-row{display:grid;grid-template-columns:1.1fr 1fr 1.4fr;gap:10px;margin-top:10px}
.pm-box{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface-2);min-width:0}
.pm-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:600;margin-bottom:8px}
.pm-s{font-size:11.5px;color:var(--muted);font-weight:500}
.pm-cnt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px}
.pm-cnt span{display:flex;align-items:baseline;justify-content:center;gap:5px;padding:7px 0;border-radius:9px;font-size:11px;font-weight:700;letter-spacing:.06em}
.pm-cnt b{font-family:var(--f-display);font-size:18px;letter-spacing:-.02em}
.pm-cnt .al{background:var(--good-soft);color:var(--good)} .pm-cnt .tut{background:var(--surface-solid);color:var(--muted);border:1px solid var(--line)} .pm-cnt .sat{background:var(--crit-soft);color:var(--crit)}
.pm-ch{display:flex;flex-wrap:wrap;gap:5px}
.pmc{display:inline-flex;align-items:center;gap:3px;font:600 11px var(--f-mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line);background:var(--surface-solid)}
.pmc i{font-style:normal}
.pmc.to-AL{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pmc.to-SAT{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.pmc.to-TUT{color:var(--muted)} .pmc.more{color:var(--muted)}
.pm-note{margin-top:8px;font-size:11.5px;color:var(--warn)}
.pm-pf{display:flex;align-items:baseline;gap:10px}
.pm-pf b{font-family:var(--f-display);font-size:22px}
.pm-pf span{font:600 12.5px var(--f-mono)}
.pm-br{display:flex;height:7px;border-radius:7px;overflow:hidden;gap:2px;margin:2px 0 6px}
.pm-br .u{background:var(--good)} .pm-br .n{background:var(--line-strong)} .pm-br .d{background:var(--crit)}
.pm-nw{display:flex;flex-direction:column}
.pm-nw a{display:flex;flex-direction:column;gap:2px;padding:7px 0;border-top:1px solid var(--line);text-decoration:none}
.pm-nw a:first-child{border-top:0;padding-top:0}
.pm-nw a span{font-size:13px;font-weight:500;line-height:1.35}
.pm-nw a:hover span{color:var(--accent-2)}
.pm-nw small{font-size:11px;color:var(--muted)}

<script>

  projeler:'<path d="M4 6h6l2 2h8v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Z"/>',

  fb:'<circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 4.5h-5L8 10l4-3Z"/><path d="M12 3v4M21 10l-5 0M3 10h5M7 20l2.5-5.5M17 20l-2.5-5.5"/>',

};
const TABS = [["bugun","Bugün"],["okul","Okul"],["gelisim","Gelişim"],["kariyer","Kariyer"],["projeler","Projeler"],["kitapfilm","Kitap & Film"],["fb","Fenerbahçe"],["finans","Finans"]];
const SHORT = {kitapfilm:"Kitap",fb:"FB",projeler:"Proje"};
const tabsEl = document.getElementById("tabs");

  if(!TABS.some(t=>t[0]===id)) id="bugun";

/* ---------- Yardımcılar ---------- */
const esc = s => String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = u => { const s=String(u||""); return /^https?:\/\//i.test(s) ? esc(s) : ""; };
// Dersler sabit, birbirinden ayrık bir paletten renk alır (programdaki sırasına göre); diğer her şey isimden türetilir.
const COURSE_HUES=[218,348,150,32,272,188,8,96];
const hue = s => { const k=String(s||"");
  try { const i=(typeof D!=="undefined"&&D.courses)? D.courses.findIndex(c=>c.code===k||c.name===k) : -1; if(i>=0) return COURSE_HUES[i%COURSE_HUES.length]; } catch(_){}
  let h=7; for(const c of k) h=(h*31+c.charCodeAt(0))%9973; return Math.round(h*137.508)%360; };
const DAYS = ["","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi","Pazar"];
const DAYS_S = ["","Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { if(!s) return null; const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m? new Date(+m[1],+m[2]-1,+m[3]) : null; };
const today0 = () => { const d=new Date(); d.setHours(0,0,0,0); return d; };
const daysUntil = s => { const d=parseD(s); return d? Math.round((d-today0())/864e5) : null; };
const fmtD = (s,opt={day:"numeric",month:"long"}) => { const d=parseD(s); return d? d.toLocaleDateString("tr-TR",opt) : ""; };
const fmtDW = s => fmtD(s,{day:"numeric",month:"short",weekday:"short"});
const mins = t => { const m=/^(\d{1,2}):(\d{2})/.exec(t||""); return m? +m[1]*60+ +m[2] : null; };
const tl = n => (Number(n)||0).toLocaleString("tr-TR",{style:"currency",currency:"TRY",maximumFractionDigits:0});
const num = n => (Number(n)||0).toLocaleString("tr-TR",{maximumFractionDigits:2});
const pct = (a,b) => b>0? Math.max(0,Math.min(100,a/b*100)) : 0;
const dow = d => ((d.getDay()+6)%7)+1;
function countdown(n){
  if(n==null) return "";
  if(n<0) return `<span class="cd past" title="${-n} gün önce"><b>${-n}</b><small>gün önce</small></span>`;
  const cls = n<=3?"crit":n<=7?"warn":"far";
  if(n===0) return `<span class="cd ${cls} word"><b>Bugün</b></span>`;
  if(n===1) return `<span class="cd ${cls} word"><b>Yarın</b></span>`;
  return `<span class="cd ${cls}"><b>${n}</b><small>gün</small></span>`;
}
// Takvim yaprağı: gün + ay (+ isteğe bağlı saat)
function dtile(date,time){
  const d=parseD(date); if(!d) return "";
  const today=daysUntil(date)===0;
  return `<span class="dt${today?" on":""}"><small>${esc(d.toLocaleDateString("tr-TR",{month:"short"}).replace(".","").toLocaleUpperCase("tr-TR"))}</small><b>${d.getDate()}</b><small>${esc(time||d.toLocaleDateString("tr-TR",{weekday:"short"}).replace(".",""))}</small></span>`;
}
function nextYearly(s){ // MM-DD ya da YYYY-MM-DD → bir sonraki yıl dönümü
  const m=/(\d{2})-(\d{2})$/.exec(s||""); if(!m) return null;
  const t=today0(); let d=new Date(t.getFullYear(),+m[1]-1,+m[2]); if(d<t) d=new Date(t.getFullYear()+1,+m[1]-1,+m[2]);
  return ymd(d);
}
// Logolar: şirket/okul için Google favicon servisi, takımlar için veri kaynağının logosu. Yüklenemezse harf rozeti kalır.
const favUrl = d => d? `https://www.google.com/s2/favicons?domain=${encodeURIComponent(d)}&sz=64` : "";
const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./,""); } catch(_) { return ""; } };
const logo = (src, name, cls="fav") => src
  ? `<span class="${cls} lgw" style="--h:${hue(name)}" data-l="${esc((name||"?")[0].toUpperCase())}"><img src="${esc(src)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.classList.add('nolg');this.remove()"></span>`
  : `<span class="${cls} nolg" style="--h:${hue(name)}" data-l="${esc((name||"?")[0].toUpperCase())}"></span>`;
const bar = (p,cls="") => `<div class="bar ${cls}"><i style="width:${p.toFixed(1)}%"></i></div>`;
const empty = (txt, ex) => `<div class="empty">${txt}${ex?`<q>${esc(ex)}</q>`:""}</div>`;
const card = (cls,title,body,meta="") => `<div class="card ${cls}"><h2>${title}${meta?`<span class="meta">${meta}</span>`:""}</h2>${body}</div>`;

function sessionsOn(day){
  const out=[];
  D.courses.forEach(c=>(c.sessions||[]).forEach(s=>{ if(+s.day===day) out.push({c,s}); }));
  return out.sort((a,b)=>mins(a.s.start)-mins(b.s.start));
}
function upcoming(limitDays){
  const items=[];
  D.exams.forEach(e=>items.push({date:e.date,title:`${e.course} · ${e.type||"Sınav"}`,d:[e.time,e.room].filter(Boolean).join(" · "),kind:e.type||"Sınav",cls:"crit"}));
  D.assignments.filter(a=>a.status!=="teslim").forEach(a=>items.push({date:a.due,title:a.title,d:[a.course,a.time].filter(Boolean).join(" · "),kind:"Teslim",cls:"warn"}));
  D.calendar.forEach(c=>items.push({date:c.date,title:c.title,d:c.end?`${fmtD(c.date)} – ${fmtD(c.end)}`:"",kind:"Takvim",cls:"acc"}));
  D.dates.forEach(x=>items.push({date:x.yearly?nextYearly(x.date):x.date,title:x.title,d:x.note||"",kind:x.yearly?"Yıllık":"Gün",cls:"mark"}));
  const norm=x=>String(x||"").toLowerCase().replace(/\s+/g,"");
  D.gcal.forEach(g=>{ if(g.rec) return; if(D.exams.some(e=>e.date===g.date && norm(g.title).includes(norm(e.course)))) return;
    items.push({date:g.date,title:g.title,d:[g.time,g.location].filter(Boolean).join(" · "),kind:"Google",cls:""}); });
  D.moodle.forEach(m=>items.push({date:m.date,title:m.title,d:[m.course,m.time].filter(Boolean).join(" · "),kind:"Moodle",cls:"warn"}));
  D.subscriptions.forEach(s=>{const n=nextRenew(s); if(n) items.push({date:n,title:`${s.name} yenileniyor`,d:tl(s.amount),kind:"Abonelik",cls:""});});
  return items.filter(i=>{const n=daysUntil(i.date); return n!=null && n>=0 && n<=limitDays;}).sort((a,b)=>a.date.localeCompare(b.date));
}

  const fm = currentMonth();
  const finBody = fm? (()=>{const inc=sum(fm.income), exp=sum(monthExp(fm)), sub=subMonthly(); return `<div class="kpis"><div><div class="label">Kalan</div><div class="big money ${inc-exp<0?"neg":""}">${tl(inc-exp)}</div></div><div><div class="label">Harcanan</div><div class="big money">${tl(exp)}</div></div></div>${bar(pct(exp,inc), exp>inc?"crit":"")}<div class="d" style="margin-top:6px;color:var(--muted);font-size:12px">${monthName(fm.id)} · bütçenin %${Math.round(pct(exp,inc))}'i harcandı${sub?` · abonelikler ${tl(sub)}/ay`:""}</div>`;})()
    : empty("Bu ayın bütçesi girilmedi.");
  const wk=D.gcal.filter(g=>{const n=daysUntil(g.date);return n!=null&&n>=0&&n<=7;});
  const gBody = wk.length? `<div class="list">${wk.map(g=>`<div class="row"><span class="mono" style="width:86px;flex:none;font-size:12.5px">${esc(fmtD(g.date,{day:"numeric",month:"short",weekday:"short"}))}</span><div class="main"><div class="t">${esc(g.title)}</div><div class="d">${esc([g.time&&(g.endTime?g.time+"–"+g.endTime:g.time),g.location].filter(Boolean).join(" · "))}</div></div>${countdown(daysUntil(g.date))}</div>`).join("")}</div>`
    : empty(D.gcal.length||RAW_SYNC.gcal? "Önümüzdeki 7 günde takviminde etkinlik yok." : "Google Takvim henüz bağlı değil.");
  document.getElementById("v-bugun").innerHTML = `<div class="grid">

    ${card("s6","Bağlantılar",links)}

    ${card("s12 pmcard",`<span class="pm-wm">piyasa<b>m</b></span>`,pmBody(),`<a class="lnk" href="${PM_URL}" target="_blank" rel="noopener">Siteye git ↗</a>`)}
    ${D.fb.length?card("s12","Fenerbahçe",`<div class="list">${D.fb.filter(m=>!m.score&&daysUntil(m.date)>=0).slice(0,5).map(m=>fbRow(m)).join("")}</div>`,`<a class="lnk" href="#fb">Tüm fikstür</a>`):""}
  </div>`;
  const urgent = up.filter(i=>daysUntil(i.date)<=3 && (i.kind!=="Takvim")).length;
  document.getElementById("c-bugun").textContent = urgent? urgent : "";
}

  const r=a>b?["G","win","Galibiyet"]:a<b?["M","loss","Mağlubiyet"]:["B","draw","Beraberlik"]; return `<span class="res ${r[1]}" title="${r[2]}"><i>${r[0]}</i><b>${esc(a)}<em>–</em>${esc(b)}</b></span>`; }
const SPI={Futbol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m12 7.5 3.6 2.6-1.4 4.2H9.8l-1.4-4.2L12 7.5Z"/><path d="M12 3.5v4M20.3 10.1l-4.7 0M3.7 10.1h4.7M7 19l2.8-4.7M17 19l-2.8-4.7"/></svg>',
  Basketbol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5v17M6 6c3 2.5 3 9.5 0 12M18 6c-3 2.5-3 9.5 0 12"/></svg>',
  Voleybol:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5c0 4 1.5 7 5 8.5M12 12c-3.5 1.5-6 4-6.5 7M12 12c3 2 7 2 8.3.5M12 3.5C8 5 5 8 3.6 11"/></svg>'};
const spBadge = m => `<span class="spb ${SPORT[m.sport]||""}" title="${esc(m.sport)} · ${esc(m.comp)}">${SPI[m.sport]||esc(m.sport[0])}</span>`;
function fbRow(m,showDate=true){

/* ---------- piyasam kutusu (emrcnkkl.github.io/quant-bot verisi; 10 dk önbellek) ---------- */
const PM_URL="https://emrcnkkl.github.io/quant-bot/";
const PM_SYMS=["XU100.IS","USDTRY=X","EURTRY=X","GRAM","BTC-USD"];
let PMD=null, pmErr=false;
async function loadPiyasam(){
  try{ const c=JSON.parse(localStorage.getItem("panel.pm")||"null"); if(c&&Date.now()-c.t<10*60e3){ PMD=c; schedule(); return; } }catch(_){}
  const get=f=>fetch(PM_URL+f,{cache:"no-cache"}).then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); });
  const [mk,sg,lv,nw]=await Promise.allSettled(["markets.json","signals.json","live.json","news.json"].map(get));
  const d={t:Date.now()};
  if(mk.status==="fulfilled"){ const items=mk.value.groups.flatMap(g=>g.items); d.mk=PM_SYMS.map(sy=>items.find(i=>i.sym===sy)).filter(Boolean).map(i=>({name:i.name.replace(" / TL",""),last:i.last,chg:i.chg,dec:i.dec,unit:i.unit,spark:(i.spark||[]).slice(-40)})); d.bist=mk.value.bist&&{adv:mk.value.bist.adv,dec:mk.value.bist.dec,unch:mk.value.bist.unch,vol:mk.value.bist.vol_bn}; d.gen=mk.value.generated_at; }
  if(sg.status==="fulfilled"){ const v=sg.value; d.sig={counts:v.counts,date:v.data_date,blocking:v.regime&&v.regime.blocking,ch:(v.changes||[]).filter(c=>c.date===v.data_date).map(c=>({t:c.ticker,n:c.name,from:c.from,to:c.to}))}; }
  if(lv.status==="fulfilled"){ const v=lv.value, last=v.points[v.points.length-1]; d.live={value:last.value,ret:(last.value/v.start_value-1)*100,bench:(last.bench/v.start_value-1)*100,since:v.start_date,n:(v.holdings||[]).length}; }
  if(nw.status==="fulfilled"){ d.news=(nw.value.items||[]).slice(0,3).map(x=>({t:x.title,l:x.link,s:x.src,ts:x.ts})); }
  pmErr=!d.mk&&!d.sig; if(!pmErr){ PMD=d; try{ localStorage.setItem("panel.pm",JSON.stringify(d)); }catch(_){} }
  schedule();
}
function spark(arr,up){
  if(!arr||arr.length<2) return "";
  const lo=Math.min(...arr), hi=Math.max(...arr), r=hi-lo||1, W=100, H=28;
  const pts=arr.map((v,i)=>`${(i/(arr.length-1)*W).toFixed(1)},${(H-2-(v-lo)/r*(H-4)).toFixed(1)}`);
  return `<svg class="spk ${up?"up":"down"}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path class="a" d="M0,${H} L${pts.join(" L")} L${W},${H} Z"/><path class="l" d="M${pts.join(" L")}"/></svg>`;
}
const pmNum=(v,dec)=>Number(v).toLocaleString("tr-TR",{minimumFractionDigits:dec,maximumFractionDigits:dec});
const pmPct=v=>`${v>0?"+":v<0?"−":""}%${Math.abs(v).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})}`;
function pmBody(){
  if(!PMD) return empty(pmErr? "piyasam verisi şu an alınamadı." : "piyasam verisi yükleniyor…");
  const d=PMD;
  const mk=(d.mk||[]).map(i=>`<a class="pm-t" href="${PM_URL}piyasalar.html" target="_blank" rel="noopener"><span class="pm-n">${esc(i.name)}</span><b class="mono">${i.unit==="$"?"$":""}${pmNum(i.last,i.dec>2?2:i.dec)}${i.unit==="₺"?" ₺":""}</b><span class="pm-c ${i.chg>0?"pos":i.chg<0?"neg":""}">${pmPct(i.chg)}</span>${spark(i.spark,i.chg>=0)}</a>`).join("");
  const sg=d.sig;
  const sigH = sg? `<div class="pm-box"><div class="pm-h"><span>BIST50 Sinyal</span><a class="lnk" href="${PM_URL}sinyal.html" target="_blank" rel="noopener">Sinyaller</a></div>
      <div class="pm-cnt"><span class="al"><b>${sg.counts.AL}</b>AL</span><span class="tut"><b>${sg.counts.TUT}</b>TUT</span><span class="sat"><b>${sg.counts.SAT}</b>SAT</span></div>
      ${sg.ch.length?`<div class="pm-ch">${sg.ch.slice(0,8).map(c=>`<span class="pmc to-${c.to}" title="${esc(c.n)}: ${esc(c.from)} → ${esc(c.to)}">${esc(c.t)}<i>${c.to==="AL"?"↑":c.to==="SAT"?"↓":"→"}</i></span>`).join("")}${sg.ch.length>8?`<span class="pmc more">+${sg.ch.length-8}</span>`:""}</div>`:`<div class="d" style="font-size:12px;color:var(--muted)">Bugün sinyal değişimi yok.</div>`}
      ${sg.blocking?`<div class="pm-note">Reel faiz filtresi açık: model yeni alım yapmıyor.</div>`:""}</div>` : "";
  const lv=d.live, b=d.bist;
  const midH = `<div class="pm-box">${lv?`<div class="pm-h"><span>Canlı model portföy</span><span class="mono pm-s">${esc(fmtD(lv.since,{day:"numeric",month:"short"}))}'dan beri</span></div>
      <div class="pm-pf"><b class="mono">${pmNum(lv.value,0)} ₺</b><span class="${lv.ret>=0?"pos":"neg"}">${pmPct(lv.ret)}</span></div>
      <div class="pm-s">BIST karşılaştırma ${pmPct(lv.bench)} · ${lv.n? lv.n+" hisse":"tamamı nakitte"}</div>`:""}
      ${b?`<div class="pm-h" style="margin-top:12px"><span>Piyasa genişliği</span><span class="mono pm-s">${b.vol!=null?pmNum(b.vol,1)+" mr ₺ hacim":""}</span></div>
      <div class="pm-br"><i class="u" style="flex:${b.adv}"></i><i class="n" style="flex:${b.unch}"></i><i class="d" style="flex:${b.dec}"></i></div>
      <div class="pm-s"><span class="pos">${b.adv} yükselen</span> · <span class="neg">${b.dec} düşen</span></div>`:""}</div>`;
  const nw = d.news&&d.news.length? `<div class="pm-box"><div class="pm-h"><span>Haberler</span><a class="lnk" href="${PM_URL}haberler.html" target="_blank" rel="noopener">Tümü</a></div><div class="pm-nw">${d.news.map(x=>`<a href="${url(x.l)}" target="_blank" rel="noopener"><span>${esc(x.t)}</span><small>${esc(x.s)} · ${new Date(x.ts).toLocaleTimeString("tr-TR",{hour:"2-digit",minute:"2-digit"})}</small></a>`).join("")}</div></div>` : "";
  return `<div class="pm-mk">${mk}</div><div class="pm-row">${sigH}${midH}${nw}</div>`;
}

let studyOv={}; try{ studyOv=JSON.parse(localStorage.getItem("panel.study")||"{}"); }catch(_){}
let prepOpen=null; // açık sınav anahtarı
const isDone = id => (id in studyOv) ? !!studyOv[id] : (D.studyDone||[]).includes(id);
const examKey = e => `${e.course}|${e.type}|${e.date}`;
function examTopics(e){
  const c=D.courses.find(x=>x.code===e.course); if(!c||!c.syllabus||!e.covers) return null;
  const chs=[];
  for(const ch of c.syllabus){ if(!e.covers.map(String).includes(String(ch.ch))) continue;
    const items=ch.items.map((it,i)=>{const o=typeof it==="string"?{t:it}:it; return {...o,id:`${c.code}:${ch.ch}-${i+1}`};}).filter(o=>!(e.skip||[]).includes(o.k));
    if(items.length) chs.push({ch:ch.ch,title:ch.title,items}); }
  return chs;
}
function examProgress(e){ const chs=examTopics(e); if(!chs) return null; const all=chs.flatMap(c=>c.items); const d=all.filter(x=>isDone(x.id)).length; return {chs,total:all.length,done:d}; }
function prepBody(){
  const ex=D.exams.filter(e=>e.covers&&daysUntil(e.date)>=0).sort((a,b)=>a.date.localeCompare(b.date));
  if(!ex.length) return empty("Hazırlık planı olan yaklaşan sınav yok. Ders syllabus'unu gönderirsen konuları eklerim.");
  if(prepOpen==null) prepOpen=examKey(ex[0]);
  return ex.map(e=>{
    const pr=examProgress(e), n=daysUntil(e.date), left=pr.total-pr.done, p=pct(pr.done,pr.total), open=prepOpen===examKey(e);
    const pace = left===0? "Tüm konular çalışıldı" : n===0? `Sınav bugün · ${left} konu kaldı` : `Günde ~${Math.ceil(left/n)} konu`;
    return `<div class="prep${open?" open":""}">
      <button type="button" class="prep-h" data-k="${esc(examKey(e))}" aria-expanded="${open}">${dtile(e.date,e.time)}<span class="code" style="--h:${hue(e.course)}">${esc(e.course)}</span>
        <span class="main"><span class="t">${esc(e.type)}${e.weight?` <span class="chip">%${esc(e.weight)}</span>`:""}</span><span class="d">${esc(e.coversNote||"")}${e.coversNote?" · ":""}${pr.done}/${pr.total} konu · ${pace}</span>${bar(p,p>=100?"good":"")}</span>
        <span class="pring" style="--p:${p.toFixed(1)}"><b>${Math.round(p)}</b></span>${countdown(n)}</button>
      ${open?`<div class="prep-b">${pr.chs.map(ch=>{const dn=ch.items.filter(x=>isDone(x.id)).length; return `<div class="pch"><div class="pch-h"><b>${esc(ch.title)}</b><span class="mono">${dn}/${ch.items.length}</span></div><div class="tps">${ch.items.map(it=>`<button type="button" class="tp${it.k?" "+it.k:""}" aria-pressed="${isDone(it.id)}" data-id="${esc(it.id)}">${esc(it.t)}${it.k==="concept"?`<em>kavram</em>`:it.k==="lab"?`<em>lab</em>`:""}</button>`).join("")}</div></div>`;}).join("")}</div>`:""}
    </div>`;}).join("");
}

/* ---------- GANO hesaplayıcı ---------- */
const GRADES=[["AA",4],["BA",3.5],["BB",3],["CB",2.5],["CC",2],["DC",1.5],["DD",1],["F",0]];
const GP=Object.fromEntries(GRADES);
let gpaSel={}; try{ gpaSel=JSON.parse(localStorage.getItem("panel.gpa")||"{}"); }catch(_){}
const f2 = n => (Math.round(n*100+1e-9)/100).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2});
function gpaCalc(){
  const base=D.settings.gpaBase||null; if(!base) return null;
  let P=+base.points, C=+base.credits;
  for(const c of D.courses){ if(c.repeatOf){ P-= (GP[c.repeatOf.grade]??0)*(+c.repeatOf.credit||0); C-= (+c.repeatOf.credit||0); } }
  const P0=P, C0=C; let sP=0, sC=0, open=0;
  for(const c of D.courses){ const cr=+c.credit||0, g=gpaSel[c.code]; if(g&&GP[g]!=null){ sP+=GP[g]*cr; sC+=cr; } else open+=cr; }
  return { cur:+base.points/+base.credits, gpa:(P0+sP)/(C0+sC||1), spa:sC?sP/sC:null, P0, C0, sP, sC, open };
}
function gpaBody(){
  const base=D.settings.gpaBase;
  if(!base||!D.courses.length) return empty("GANO hesaplamak için BUIS'teki toplam kredi ve puanın gerekli.");
  const r=gpaCalc(), delta=r.gpa-r.cur;
  const rows=D.courses.map(c=>`<div class="gp-row"><div class="gp-c"><span class="code" style="--h:${hue(c.code)}">${esc(c.code)}</span><small>${esc(c.credit)} kredi${c.repeatOf?` · ${esc(c.repeatOf.code)} ${esc(c.repeatOf.grade)} yerine`:""}</small></div>
    <div class="gp-g" role="radiogroup" aria-label="${esc(c.code)} notu" data-c="${esc(c.code)}">${GRADES.map(([g])=>`<button type="button" role="radio" aria-checked="${gpaSel[c.code]===g}" data-g="${g}" class="g-${g}">${g}</button>`).join("")}</div></div>`).join("");
  // 2.00 ve 2.50 için gereken dönem ortalaması (seçilmeyen dersler için)
  const need = t => { if(!r.open) return null; const x=(t*(r.C0+r.sC+r.open)-r.P0-r.sP)/r.open; return x; };
  const hint = [2,2.5,3].map(t=>{const x=need(t); if(x==null) return ""; const txt= x<=0? "zaten sağlanıyor" : x>4? "bu dönem ulaşılamaz" : `kalan derslerde ort. <b>${f2(x)}</b>`; return `<li><span class="mono">${t.toFixed(2).replace(".",",")}</span> için ${txt}</li>`;}).join("");
  return `<div class="gp-top">
      <div><div class="label">Şu anki GANO</div><div class="big">${f2(r.cur)}</div></div>
      <div class="gp-arrow" aria-hidden="true">→</div>
      <div><div class="label">Dönem sonu GANO</div><div class="big ${delta>=0.005?"pos":delta<=-0.005?"neg":""}">${f2(r.gpa)}</div><small class="${delta>=0?"pos":"neg"}">${delta>=0?"+":""}${f2(Math.abs(delta)*Math.sign(delta)||0)}</small></div>
      <div><div class="label">Dönem ortalaması</div><div class="big">${r.spa!=null?f2(r.spa):"—"}</div><small>${r.sC} / ${r.sC+r.open} kredi seçildi</small></div>
    </div>
    <div class="gp-list">${rows}</div>
    <div class="gp-foot">${r.open?`<ul>${hint}</ul>`:`<span>Tüm notlar seçildi.</span>`}<button type="button" class="btn gp-reset">Temizle</button></div>`;
}
document.getElementById("v-okul").addEventListener("click",e=>{
  const b=e.target.closest(".gp-g button"); const rs=e.target.closest(".gp-reset");
  if(b){ const c=b.parentElement.dataset.c, g=b.dataset.g; gpaSel[c]= gpaSel[c]===g? undefined : g; }
  else if(rs){ gpaSel={}; } else return;
  try{ localStorage.setItem("panel.gpa",JSON.stringify(gpaSel)); }catch(_){}
  const el=document.getElementById("gpaBody"); if(el) el.innerHTML=gpaBody();
});

function renderSchool(){
  const now=new Date(), td=dow(now), m=now.getHours()*60+now.getMinutes();
  const all=[]; D.courses.forEach(c=>(c.sessions||[]).forEach(s=>all.push({c,s})));
  let week;
  if(all.length){
    const maxDay = Math.max(5,...all.map(x=>+x.s.day||1));
    let lo=Math.min(...all.map(x=>mins(x.s.start))), hi=Math.max(...all.map(x=>mins(x.s.end)));
    lo=Math.floor(lo/60)*60; hi=Math.ceil(hi/60)*60; const PX=1.2, H=(hi-lo)*PX;
    const hours=[]; for(let t=lo;t<=hi;t+=60) hours.push(t);
    const lines = hours.map(t=>`<div class="wline" style="top:${(t-lo)*PX}px"></div>`).join("")+hours.slice(0,-1).map(t=>`<div class="wline half" style="top:${(t+30-lo)*PX}px"></div>`).join("");
    const t0=today0(), monday=new Date(t0.getTime()-(td-1)*864e5);
    let html = `<div></div>`+Array.from({length:maxDay},(_,i)=>{const dd=new Date(monday.getTime()+i*864e5), n=all.filter(x=>+x.s.day===i+1).length;
      return `<div class="wh ${i+1===td?"today":""}"><span>${DAYS_S[i+1]}</span><b>${dd.getDate()}</b><small>${n?n+" ders":"boş"}</small></div>`;}).join("");
    html += `<div class="wtimes" style="height:${H}px">${hours.map(t=>`<span class="mono" style="top:${(t-lo)*PX}px">${pad(t/60)}:00</span>`).join("")}</div>`;
    const pin='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11Z"/><circle cx="12" cy="10" r="2.3"/></svg>';
    for(let day=1;day<=maxDay;day++){
      const blocks = all.filter(x=>+x.s.day===day).map(({c,s})=>{const st=mins(s.start),en=mins(s.end), dur=en-st;
        const state = day===td ? (m>=st&&m<en?" live":m>=en?" over":"") : (day<td?" over":"");
        const room=s.room||c.room||"";
        return `<div class="blk${dur<60?" short":""}${state}" style="--h:${hue(c.code||c.name)};top:${(st-lo)*PX+2}px;height:${dur*PX-4}px" title="${esc(c.code||"")} ${esc(c.name)} · ${esc(s.start)}–${esc(s.end)}${room?" · "+esc(room):""}">
          <div class="bh"><b>${esc(c.code||c.name)}</b>${s.type?`<em>${esc(s.type)}</em>`:""}${state===" live"?`<i class="livedot" aria-label="Şu an"></i>`:""}</div>
          ${dur>=60?`<div class="bn">${esc(c.name)}</div>`:""}
          <div class="bf"><span class="mono">${esc(s.start)}–${esc(s.end)}</span>${room?`<span class="br">${pin}${esc(room)}</span>`:""}</div></div>`;}).join("");
      const nl = day===td && m>=lo && m<=hi ? `<div class="nowline" style="top:${(m-lo)*PX}px"><span class="mono">${pad(Math.floor(m/60))}:${pad(m%60)}</span></div>`:"";
      html += `<div class="wcol ${day===td?"today":""}" style="height:${H}px">${lines}${blocks}${nl}</div>`;
    }
    const slots = (a,b) => Math.max(1,Math.round((mins(b)-mins(a))/60)); // 50 dk = 1 ders saati
    const totalH = all.reduce((a,x)=>a+slots(x.s.start,x.s.end),0);
    const legend = `<div class="wlegend">${D.courses.map(c=>{const h=(c.sessions||[]).reduce((a,x)=>a+slots(x.start,x.end),0);
      return `<span style="--h:${hue(c.code||c.name)}"><i></i><b>${esc(c.code||"")}</b>${esc(c.name)}<em class="mono">${h} saat</em></span>`;}).join("")}<span class="wtotal">Haftada <b>${totalH} saat</b> ders</span></div>`;
    week = `<div class="week-wrap"><div class="week" style="--days:${maxDay}">${html}</div></div>${legend}`;
  } else week = empty("Ders programı boş. Derslerini gün ve saatleriyle bana yaz:","ECON201 Mikroiktisat — Pzt 09:00–11:50 B-204, Per 13:00–14:50 B-110 · 6 AKTS · Doç. Dr. Yılmaz");

  const exams=[...D.exams].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  const examT = exams.length? `<div class="list">${exams.map(e=>{const n=daysUntil(e.date), cls=/final/i.test(e.type)?"crit":/vize|ara/i.test(e.type)?"warn":"";

function nextRenew(s){
  if(s.cycle==="yillik") return s.date? nextYearly(s.date) : null;
  const day=+s.day; if(!day) return null; const t=today0();
  let d=new Date(t.getFullYear(),t.getMonth(),Math.min(day,28)); if(d<t) d=new Date(t.getFullYear(),t.getMonth()+1,Math.min(day,28));
  return ymd(d);
}

const cmdk=document.getElementById("cmdk"), cIn=document.getElementById("cmdkInput"), cList=document.getElementById("cmdkList");

function cIndex(){

  TABS.forEach(([id,l],i)=>it.push({k:"Sekme",t:l,d:String(i+1),go:()=>{location.hash=id;showTab(id);}}));

  return it;
}
const fold=x=>String(x||"").toLocaleLowerCase("tr-TR").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ı/g,"i");
function cRender(){
  const q=fold(cIn.value).trim();
  const all=cIndex();
  cItems=q? all.filter(x=>q.split(/\s+/).every(w=>fold(x.t+" "+x.k+" "+x.d).includes(w))) : all.filter(x=>x.k==="Sekme"||x.k==="Spotify"||x.k==="Bağlantı");
  cSel=Math.min(cSel,Math.max(0,cItems.length-1));
  cList.innerHTML = cItems.length? cItems.slice(0,40).map((x,i)=>`<div class="cmdk-it" role="option" data-i="${i}" aria-selected="${i===cSel}"><span class="k">${esc(x.k)}</span><span class="t">${esc(x.t)}</span><span class="d">${esc(x.d||"")}</span></div>`).join("") : `<div class="cmdk-empty">Sonuç yok</div>`;
  cList.querySelector('[aria-selected="true"]')?.scrollIntoView({block:"nearest"});
}
function cOpen(){ cmdk.hidden=false; cIn.value=""; cSel=0; cRender(); cIn.focus(); }
function cClose(){ cmdk.hidden=true; }
function cRun(i){ const x=cItems[i]; if(!x) return; cClose(); if(x.go) x.go(); else if(x.url) window.open(x.url,"_blank","noopener"); }

document.addEventListener("keydown",e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName||"");
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){ e.preventDefault(); cmdk.hidden?cOpen():cClose(); return; }
  if(!cmdk.hidden){
    if(e.key==="Escape"){ cClose(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); cSel=Math.min(cSel+1,cItems.length-1); cRender(); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); cSel=Math.max(cSel-1,0); cRender(); }
    else if(e.key==="Enter"){ e.preventDefault(); cRun(cSel); }
    return;
  }
  if(typing||e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); cOpen(); return; }
  const n=parseInt(e.key,10); if(n>=1&&n<=TABS.length){ const id=TABS[n-1][0]; location.hash=id; showTab(id); }
});

  applyAll(get());
  mBtn.addEventListener("click", () => { const n = { system: "light", light: "dark", dark: "system" }[get()]; try { localStorage.setItem("panel.theme", n); } catch (_) {} applyAll(n); });

    const b = e.target.closest("button"); if (!b) return;

  const enc = window.PANEL_ENC;
  if (!enc) { window.__boot(); return; }
  const lock = document.getElementById("lock"), err = document.getElementById("lockErr");
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const toB64 = buf => { let s = ""; new Uint8Array(buf).forEach(b => s += String.fromCharCode(b)); return btoa(s); };
  const KEY = "panel.key." + enc.salt;
  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt: new TextEncoder().encode(enc.salt), iterations: enc.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  async function open(key) {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(enc.iv) }, key, b64(enc.ct));
    window.PANEL_DATA = JSON.parse(new TextDecoder().decode(pt));
    lock.hidden = true;
    window.__boot();
    const sync = document.getElementById("sync");
    const b = document.createElement("button"); b.className = "lockout"; b.type = "button"; b.textContent = "Kilitle";
    b.onclick = () => { try { localStorage.removeItem(KEY); } catch (_) {} location.reload(); };
    sync.appendChild(b);
  }
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) { await open(await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"])); return; }
  } catch (_) { try { localStorage.removeItem(KEY); } catch (_) {} }
  lock.hidden = false;
  document.getElementById("lockPw").focus();
  document.getElementById("lockForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = document.getElementById("lockBtn"); btn.textContent = "Açılıyor…"; err.textContent = "";
    try {
      if (!window.crypto?.subtle) throw new Error("nocrypto");
      const key = await derive(document.getElementById("lockPw").value);
      await open(key);
      if (document.getElementById("lockRem").checked) { try { localStorage.setItem(KEY, toB64(await crypto.subtle.exportKey("raw", key))); } catch (_) {} }
    } catch (x) {
      btn.textContent = "Aç";
      err.textContent = x && x.message === "nocrypto" ? "Bu tarayıcı şifre çözmeyi desteklemiyor." : "Şifre yanlış.";
      document.getElementById("lockPw").select();
    }
  });
})();
</script>
